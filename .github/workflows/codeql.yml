name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Fabric side is one shared source tree (`src/client/java`) resolved per-version by
          # Stonecutter; building one representative version is enough for CodeQL to trace real
          # compiled output for that source, rather than the templated (pre-Stonecutter) files.
          - name: fabric
            build: ./gradlew :1.21.1:build --no-daemon
          # The three NeoForge ports are separate Gradle projects that intentionally reuse the
          # same Java package/class names as the Fabric side (they're 1:1 ports, kept diff-friendly
          # against each other) — each needs its own build-mode:manual run and its own analysis
          # category, otherwise CodeQL treats the whole checkout as one namespace and silently
          # drops ~3/4 of the clashing classes from analysis (see issue tracker for background).
          - name: neoforge-1.21.1
            build: cd neoforge && ./gradlew build --no-daemon
          - name: neoforge-1.21.11
            build: cd neoforge-1.21.11 && ./gradlew build --no-daemon
          - name: neoforge-26.2
            build: cd neoforge-26.2 && ./gradlew build --no-daemon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # All four projects build against Java 21 (NeoGradle specifically requires it regardless
      # of target Minecraft version; the shared Fabric root also supports 21 for MC 1.21.1).
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build (${{ matrix.name }})
        run: ${{ matrix.build }}

      # build-mode:manual extracts every file the traced build compiles, including
      # NeoGradle's own neoForm step decompiling vanilla Minecraft into build/. The
      # config-file paths-ignore option does NOT filter compiled-language results that
      # come from build tracing (verified: identical results_count with and without
      # it) — so filter the SARIF by hand before upload instead of relying on it.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin-${{ matrix.name }}"
          output: ../results
          upload: never

      - name: Drop NeoForm-decompiled vanilla source from SARIF
        run: |
          python3 - <<'PY'
          import json, glob

          def touches_build(result):
              locs = result.get("locations", []) + result.get("relatedLocations", [])
              for loc in locs:
                  uri = loc.get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
                  if "/build/" in uri or uri.startswith("build/"):
                      return True
              for flow in result.get("codeFlows", []):
                  for thread in flow.get("threadFlows", []):
                      for step in thread.get("locations", []):
                          uri = step.get("location", {}).get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
                          if "/build/" in uri or uri.startswith("build/"):
                              return True
              return False

          for path in glob.glob("../results/*.sarif"):
              with open(path) as f:
                  sarif = json.load(f)
              for run in sarif.get("runs", []):
                  run["results"] = [r for r in run.get("results", []) if not touches_build(r)]
              with open(path, "w") as f:
                  json.dump(sarif, f)
          PY

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ../results
          category: "/language:java-kotlin-${{ matrix.name }}"
